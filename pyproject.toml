[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fitzsight"
version = "0.13.0"
description = "Evidence-grounded financial operations intelligence with bounded DeepSeek V4 planning, deterministic analytics, auditable verification, and human decision boundaries"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.4,<2",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scipy>=1.12,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
submission = ["Pillow>=10,<13", "pypdf>=5,<7", "reportlab>=4,<5"]
deepseek = ["httpx>=0.27,<1"]
ui = ["streamlit>=1.40,<2"]
demo = [
    "httpx>=0.27,<1",
    "streamlit>=1.40,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
