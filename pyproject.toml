[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fitzsight"
version = "0.5.0"
description = "Evidence-grounded multi-intent financial operations intelligence with constrained Agent planning and verified tool execution"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.4,<2",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scipy>=1.12,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
openai = ["openai>=1.0,<3"]
ui = ["streamlit>=1.40,<2"]
demo = [
    "openai>=1.0,<3",
    "streamlit>=1.40,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
